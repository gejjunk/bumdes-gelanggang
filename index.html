            ]
        };

        // =========================================================================
        // 2. MESIN SINKRONISASI CLOUD (SUPABASE POSTGRESQL + REALTIME)
        // =========================================================================
        const CLOUD_KEYS = ['wargaList', 'pengumuman', 'produkList', 'pesananList', 'pinjamanList', 'asetList', 'bookingList', 'transaksiKas', 'aspirasiList', 'kontakDarurat'];

        async function initCloudSync() {
            const configured = SUPABASE_URL && !SUPABASE_URL.includes('GANTI_DENGAN_') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('GANTI_DENGAN_');
            if (!configured || typeof window.supabase === 'undefined') {
                setCloudBadge(false);
                return;
            }
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                const { data, error } = await supabaseClient.from('bumdes_store').select('key, value');
                if (error) {
                    console.error('Supabase fetch error:', error);
                    setCloudBadge(false);
                    showToast('Koneksi Supabase gagal. Pastikan tabel bumdes_store sudah dibuat.', 'error');
                    return;
                }

                isCloudConnected = true;
                setCloudBadge(true);

                if (!data || data.length === 0) {
                    const rows = CLOUD_KEYS.map(k => ({ key: k, value: state[k] }));
                    await supabaseClient.from('bumdes_store').upsert(rows, { onConflict: 'key' });
                } else {
                    data.forEach(row => {
                        if (CLOUD_KEYS.includes(row.key) && row.value !== null && row.value !== undefined) {
                            state[row.key] = row.value;
                        }
                    });
                    initWargaSelector();
                    renderApp();
                }

                supabaseClient
                    .channel('bumdes-warga-realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'bumdes_store' }, (payload) => {
                        if (payload.new && CLOUD_KEYS.includes(payload.new.key)) {
                            state[payload.new.key] = payload.new.value;
                            initWargaSelector();
                            renderApp();
                        }
                    })
                    .subscribe();

            } catch (e) {
                console.error(e);
                setCloudBadge(false);
            }
        }

        async function syncCloudKey(key) {
            if (supabaseClient && isCloudConnected) {
                const { error } = await supabaseClient
                    .from('bumdes_store')
                    .upsert({ key: key, value: state[key], updated_at: new Date().toISOString() }, { onConflict: 'key' });
                if (error) {
                    console.error('Gagal sync ke Supabase:', error);
                    showToast('Gagal menyimpan ke Supabase, cek koneksi internet.', 'error');
                }
            }
        }

        function setCloudBadge(online) {
            const el = document.getElementById('cloud-status');
            if (!el) return;
            if (online) {
                el.className = 'inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-400/25 text-emerald-100 font-semibold shrink-0';
                el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span> Supabase';
            } else {
                el.className = 'inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full bg-amber-400/20 text-amber-200 font-semibold shrink-0';
                el.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-amber-300"></span> Lokal';
            }
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const colors = { success: 'bg-emerald-600 text-white', info: 'bg-slate-800 text-white', warning: 'bg-amber-500 text-white', error: 'bg-rose-600 text-white' };
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold fade-in ${colors[type] || colors.info}`;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function openModal(title, body, footer = '') {
            document.getElementById('modal-title').textContent = title;

                        <option value="Dusun Gelanggang Selatan">Dusun Gelanggang Selatan</option>
                        <option value="Dusun Montong Baru">Dusun Montong Baru</option>
                    </select>
                    <input id="dw-wa" placeholder="No. WhatsApp (contoh: 0819...)" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                </div>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Batal</button>
                <button onclick="saveDaftarWarga()" class="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Daftar Sekarang</button>
            `);
        }

        function saveDaftarWarga() {
            const nama = document.getElementById('dw-nama').value.trim();
            const nik = document.getElementById('dw-nik').value.trim();
            const dusun = document.getElementById('dw-dusun').value;
            const waRaw = document.getElementById('dw-wa').value.replace(/[^0-9]/g, '');
            if (!nama || nik.length < 10) { showToast('Isi Nama Lengkap & NIK yang valid!', 'warning'); return; }
            const newId = 'W' + String(Date.now()).slice(-4);
            state.wargaList.push({ id: newId, nama, nik, dusun, wa: waRaw.replace(/^0/, '62') || '628', status: 'Aktif' });
            state.activeWargaId = newId;
            syncCloudKey('wargaList');
            closeModal();
            initWargaSelector();
            renderApp();
            showToast(`Selamat datang, ${nama}! Akun warga terdaftar.`, 'success');
        }

        function updateCartBadge() {
            const qty = state.cart.reduce((s, i) => s + i.qty, 0);
            const b = document.getElementById('warga-cart-badge');
            if (!b) return;
            b.textContent = qty;
            b.classList.toggle('hidden', qty === 0);
        }

        function initWargaSelector() {
            const sel = document.getElementById('warga-selector');
            if (!sel) return;
            sel.innerHTML = state.wargaList.map(w =>
                `<option value="${w.id}" class="text-slate-800" ${w.id === state.activeWargaId ? 'selected' : ''}>${w.nama}</option>`
            ).join('');
            const active = getActiveWarga();
            if (active) document.getElementById('warga-dusun-label').textContent = active.dusun;
        }

        function changeActiveWarga(id) {
            state.activeWargaId = id;
            state.cart = [];
            initWargaSelector();
            updateCartBadge();
            renderApp();
        }

        function setWargaTab(tab) {
            state.wargaTab = tab;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function calcTransparansi() {
            let masuk = 0, keluar = 0, pendUsaha = 0, beban = 0;
            const perUnit = { 'Toko UMKM': 0, 'Simpan Pinjam': 0, 'Sewa Aset': 0 };
            state.transaksiKas.forEach(t => {
                if (t.jenis === 'Masuk') {
                    masuk += t.nominal;
                    if (t.unit !== 'Modal Desa') {
                        pendUsaha += t.nominal;
                        if (perUnit[t.unit] !== undefined) perUnit[t.unit] += t.nominal;
                    }
                } else { keluar += t.nominal; beban += t.nominal; }
            });
            const laba = Math.max(0, pendUsaha - beban);
            return { saldoKas: masuk - keluar, pendUsaha, beban, pades: Math.round(laba * 0.30), perUnit };
        }

        // =========================================================================
        // 4. RENDER HALAMAN WARGA
        // =========================================================================
        function renderApp() {
            document.querySelectorAll('.wtab-btn').forEach(btn => {
                const act = btn.dataset.wtab === state.wargaTab;
                btn.className = act ? 'wtab-btn px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-emerald-700 shadow-sm' : 'wtab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition text-emerald-100 hover:text-white';
            });
            document.querySelectorAll('.wtab-mobile').forEach(btn => {
                const act = btn.dataset.wtab === state.wargaTab;
                btn.className = act ? 'wtab-mobile flex flex-col items-center gap-1 p-1.5 rounded-xl text-[10px] font-bold min-w-[52px] text-emerald-600 bg-emerald-50' : 'wtab-mobile flex flex-col items-center gap-1 p-1.5 rounded-xl text-[10px] font-medium min-w-[52px] text-slate-500';
            });

            const el = document.getElementById('warga-content');
            const warga = getActiveWarga();
            if (!el || !warga) return;

            if (state.wargaTab === 'beranda') renderBeranda(el, warga);
            else if (state.wargaTab === 'toko') renderToko(el, warga);
            else if (state.wargaTab === 'pinjaman') renderPinjaman(el, warga);
            else if (state.wargaTab === 'sewa') renderSewa(el, warga);
            else if (state.wargaTab === 'transparansi') renderTransparansi(el);
            else if (state.wargaTab === 'aspirasi') renderAspirasi(el, warga);
        }

                    <div class="rounded-3xl bg-gradient-to-br from-emerald-700 via-emerald-600 to-teal-700 text-white p-5 sm:p-7 shadow-lg relative overflow-hidden">
                        <div class="relative z-10 flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                                    <span><i class="fa-solid fa-box mr-1"></i> ${myOrders.length} Pesanan</span>

                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">

                        <button onclick="setWargaTab('pinjaman')" class="bg-white active:scale-95 border border-slate-200 hover:border-emerald-400 p-4 rounded-2xl text-left shadow-sm transition">

                            <p class="font-bold text-sm">Sewa Aset</p><p class="text-[11px] text-slate-500">Tenda, traktor & mobil</p>
                        </button>
                        <button onclick="setWargaTab('transparansi')" class="bg-white active:scale-95 border border-slate-200 hover:border-emerald-400 p-4 rounded-2xl text-left shadow-sm transition">
                            <div class="w-11 h-11 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg mb-2.5"><i class="fa-solid fa-chart-pie"></i></div>
                            <p class="font-bold text-sm">Transparansi</p><p class="text-[11px] text-slate-500">Kas & PADes live</p>
                        </button>
                        <button onclick="setWargaTab('aspirasi')" class="col-span-2 sm:col-span-1 bg-white active:scale-95 border border-slate-200 hover:border-emerald-400 p-4 rounded-2xl text-left shadow-sm transition">
                            <div class="w-11 h-11 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg mb-2.5"><i class="fa-solid fa-comments"></i></div>
                            <p class="font-bold text-sm">Aspirasi</p><p class="text-[11px] text-slate-500">Saran & pengaduan</p>
                        </button>
                    </div>

                    <div class="rounded-2xl bg-gradient-to-r from-rose-600 to-red-700 text-white p-4 sm:p-5 shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-white/20 flex items-center justify-center text-2xl shrink-0"><i class="fa-solid fa-truck-medical"></i></div>
                            <div>
                                <span class="px-2 py-0.5 rounded-full bg-white/20 text-[10px] font-bold uppercase">Siaga 24 Jam</span>

                        </div>
                        <button onclick="openDaruratModal()" class="px-5 py-2.5 rounded-xl bg-white text-rose-700 hover:bg-rose-50 font-extrabold text-xs shadow shrink-0 flex items-center justify-center gap-2">

                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                        <h3 class="font-bold text-sm flex items-center gap-2 mb-3"><i class="fa-solid fa-bullhorn text-emerald-600"></i> Pengumuman Desa</h3>
                        <div class="space-y-3">
                            ${state.pengumuman.map(p => `

        function renderToko(el, warga) {
            const cats = ['Semua', 'Sembako', 'Pertanian', 'UMKM Lokal'];
            const list = state.selectedCategory === 'Semua' ? state.produkList : state.produkList.filter(p => p.kategori === state.selectedCategory);
            const myOrders = state.pesananList.filter(o => o.wargaId === warga.id);

            el.innerHTML = `
                <div class="space-y-5">
                    <div class="flex flex-wrap justify-between items-center gap-3">

                        <button onclick="openCartModal()" class="px-4 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow"><i class="fa-solid fa-cart-shopping mr-1"></i> Keranjang (${state.cart.reduce((s,i)=>s+i.qty,0)})</button>
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-1">
                        ${cats.map(c => `<button onclick="state.selectedCategory='${c}';renderApp()" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${state.selectedCategory===c?'bg-emerald-600 text-white':'bg-white border text-slate-600'}">${c}</button>`).join('')}

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

                                    <p class="text-lg font-extrabold text-emerald-600 mt-1">${formatRp(p.harga)} <span class="text-xs font-normal text-slate-400">/ ${p.satuan}</span></p>
                                </div>
                                <div class="mt-4 pt-3 border-t flex justify-between items-center">

                        ${myOrders.length===0?'<p class="text-xs text-slate-400">Belum ada pesanan.</p>':myOrders.map(o=>`
                            <div class="p-3 rounded-xl bg-slate-50 border flex flex-wrap justify-between items-center gap-2 mb-2 text-xs">
                                <div><p class="font-bold">${o.id} • ${o.tanggal}</p><p class="text-slate-600">${o.items.map(i=>`${i.nama} (${i.qty}x)`).join(', ')}</p></div>
                                <div class="text-right"><p class="font-extrabold text-emerald-700">${formatRp(o.total)}</p><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${o.status==='Selesai'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${o.status}</span></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function addToCart(id) {
            const p = state.produkList.find(x => x.id === id);
            if (!p || p.stok <= 0) return;
            const ex = state.cart.find(i => i.id === id);
            ex ? ex.qty++ : state.cart.push({ id: p.id, nama: p.nama, harga: p.harga, qty: 1 });
            updateCartBadge(); renderApp(); showToast(`${p.nama} masuk keranjang`, 'success');
        }

        function openCartModal() {
            if (state.cart.length === 0) { openModal('Keranjang', '<p class="text-center py-6 text-slate-400">Keranjang kosong.</p>'); return; }
            const tot = state.cart.reduce((s, i) => s + (i.harga * i.qty), 0);
            openModal('Checkout Pesanan', `
                <div class="space-y-2 mb-3">
                    ${state.cart.map((i, idx) => `<div class="flex justify-between items-center p-2.5 rounded-xl bg-slate-50 text-xs"><div><p class="font-bold">${i.nama}</p><p class="text-emerald-600">${formatRp(i.harga)} x ${i.qty}</p></div><button onclick="state.cart.splice(${idx},1);updateCartBadge();openCartModal()" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></div>`).join('')}
                </div>
                <div class="space-y-2.5 pt-2 border-t">
                    <select id="c-kirim" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs"><option value="Antar ke Dusun">Antar ke Rumah (${getActiveWarga().dusun})</option><option value="Ambil di Kios BUMDes">Ambil di Kios BUMDes</option></select>
                    <select id="c-bayar" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs"><option value="COD">COD / Bayar di Tempat</option><option value="Transfer BUMDes">Transfer Rekening BUMDes</option></select>
                    <div class="flex justify-between font-extrabold text-base pt-1"><span>Total</span><span class="text-emerald-600">${formatRp(tot)}</span></div>
                </div>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Batal</button>
                <button onclick="checkoutCart()" class="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Kirim Pesanan</button>
            `);
        }

        function checkoutCart() {
            const w = getActiveWarga();
            const tot = state.cart.reduce((s, i) => s + (i.harga * i.qty), 0);
            const id = 'ORD-' + String(Date.now()).slice(-4);
            state.pesananList.unshift({
                id, tanggal: todayISO(), wargaId: w.id, namaWarga: w.nama, dusun: w.dusun,
                items: JSON.parse(JSON.stringify(state.cart)), total: tot,
                pengiriman: document.getElementById('c-kirim').value,
                pembayaran: document.getElementById('c-bayar').value, status: 'Menunggu'
            });
            state.cart = [];
            syncCloudKey('pesananList');
            closeModal(); updateCartBadge(); renderApp();
            showToast(`Pesanan ${id} terkirim ke Admin Desa!`, 'success');
        }

        function renderPinjaman(el, warga) {
            const myLoans = state.pinjamanList.filter(p => p.wargaId === warga.id);
            el.innerHTML = `
                <div class="grid lg:grid-cols-12 gap-5">
                    <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm h-fit space-y-4">
                        <div><h2 class="text-lg font-extrabold">Ajukan Simpan Pinjam</h2><p class="text-xs text-slate-500">Jasa 1% flat/bulan untuk warga Desa Gelanggang.</p></div>
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>Nominal</span><span id="sim-nom-lbl" class="text-emerald-600">Rp 2.000.000</span></div>
                            <input type="range" id="sim-nom" min="500000" max="15000000" step="500000" value="2000000" oninput="calcSim()" class="w-full accent-emerald-600">
                        </div>
                        <select id="sim-ten" onchange="calcSim()" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-semibold"><option value="3">3 Bulan</option><option value="6" selected>6 Bulan</option><option value="10">10 Bulan</option><option value="12">12 Bulan</option></select>
                        <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
                            <p class="text-[11px] font-bold text-emerald-800 uppercase">Angsuran / Bulan</p>
                            <p id="sim-ang" class="text-2xl font-extrabold text-emerald-700"></p>
                            <p id="sim-det" class="text-[11px] text-emerald-700 mt-1"></p>
                        </div>
                        <textarea id="loan-tujuan" rows="2" placeholder="Tujuan penggunaan modal..." class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs"></textarea>
                        <button onclick="submitLoan()" class="w-full py-3 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow">Kirim Pengajuan</button>
                    </div>
                    <div class="lg:col-span-7 space-y-3">
                        <h3 class="font-bold text-sm">Pinjaman Anda</h3>
                        ${myLoans.length===0?'<div class="bg-white rounded-2xl border p-8 text-center text-xs text-slate-400">Belum ada pinjaman.</div>':myLoans.map(l=>`
                            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm text-xs space-y-2">
                                <div class="flex justify-between items-center"><span class="font-bold text-sm">${l.id} • ${formatRp(l.nominal)}</span><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${l.status==='Aktif'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${l.status}</span></div>
                                <p class="text-slate-500">${l.tujuan}</p>
                                <p>Terbayar: <strong class="text-emerald-600">${l.sudahBayarBulan}/${l.tenor} bln (${formatRp(l.terbayar)})</strong> • Sisa: <strong class="text-rose-600">${formatRp(Math.max(0, l.totalTagihan - l.terbayar))}</strong></p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            calcSim();
        }

        function calcSim() {
            const nom = parseInt(document.getElementById('sim-nom')?.value || 2000000);
            const ten = parseInt(document.getElementById('sim-ten')?.value || 6);
            const pokok = Math.round(nom / ten), jasa = Math.round(nom * 0.01);
            document.getElementById('sim-nom-lbl').textContent = formatRp(nom);
            document.getElementById('sim-ang').textContent = formatRp(pokok + jasa);
            document.getElementById('sim-det').textContent = `Pokok ${formatRp(pokok)} + Jasa 1% ${formatRp(jasa)}`;
        }

        function submitLoan() {
            const w = getActiveWarga();
            const nominal = parseInt(document.getElementById('sim-nom').value);
            const tenor = parseInt(document.getElementById('sim-ten').value);
            const tujuan = document.getElementById('loan-tujuan').value.trim();
            if (!tujuan) { showToast('Isi tujuan modal!', 'warning'); return; }
            const ang = Math.round((nominal / tenor) + (nominal * 0.01));
            state.pinjamanList.unshift({
                id: 'PJ-' + String(Date.now()).slice(-4), tanggal: todayISO(),
                wargaId: w.id, namaWarga: w.nama, wa: w.wa, dusun: w.dusun,
                nominal, tenor, angsuranPerBulan: ang, sudahBayarBulan: 0,
                totalTagihan: ang * tenor, terbayar: 0, tujuan, status: 'Menunggu'
            });
            syncCloudKey('pinjamanList');
            renderApp();
            showToast('Pengajuan pinjaman terkirim ke Admin BUMDes!', 'success');
        }

        function renderSewa(el, warga) {
            const myB = state.bookingList.filter(b => b.wargaId === warga.id);
            el.innerHTML = `
                <div class="space-y-5">
                    <div><h2 class="text-xl font-extrabold">Sewa Aset Desa</h2><p class="text-xs text-slate-500">Daftar aset tersinkronisasi langsung dengan data Admin Desa.</p></div>
                    <div class="grid sm:grid-cols-2 gap-4">
                        ${state.asetList.map(a => `
                            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between mb-2">
                                        <div class="w-11 h-11 rounded-2xl bg-sky-100 text-sky-600 flex items-center justify-center text-lg"><i class="fa-solid ${a.icon || 'fa-building'}"></i></div>
                                        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${a.status==='Tersedia'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${a.status}</span>
                                    </div>
                                    <h3 class="font-bold text-sm">${a.nama}</h3>
                                    <p class="text-xs text-slate-500 mt-1">${a.deskripsi}</p>
                                </div>
                                <div class="mt-4 pt-3 border-t flex justify-between items-center">
                                    <p class="font-extrabold text-emerald-600">${formatRp(a.tarif)} <span class="text-xs font-normal text-slate-400">/ ${a.satuan}</span></p>
                                    <button onclick="openBookModal('${a.id}')" ${a.status!=='Tersedia'?'disabled':''} class="px-4 py-2 rounded-xl text-xs font-bold ${a.status==='Tersedia'?'bg-sky-600 text-white':'bg-slate-200 text-slate-400'}">${a.status==='Tersedia'?'Booking':'Perawatan'}</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
                        <h3 class="font-bold text-sm mb-3">Riwayat Booking Anda</h3>
                        ${myB.length===0?'<p class="text-xs text-slate-400">Belum ada booking.</p>':myB.map(b=>`
                            <div class="p-3 rounded-xl bg-slate-50 border flex justify-between items-center mb-2 text-xs">
                                <div><p class="font-bold">${b.namaAset}</p><p class="text-slate-500">Tgl Pakai: ${b.tanggalPakai} (${b.durasi} hari)</p></div>
                                <div class="text-right"><p class="font-extrabold text-emerald-700">${formatRp(b.total)}</p><span class="text-[10px] px-2 py-0.5 rounded-full bg-sky-100 text-sky-700 font-bold">${b.status}</span></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openBookModal(id) {
            const a = state.asetList.find(x => x.id === id);
            openModal('Booking Aset Desa', `
                <div class="space-y-3">
                    <div class="p-3 rounded-xl bg-sky-50 border"><p class="font-bold text-sky-900">${a.nama}</p><p class="text-xs text-sky-700">${formatRp(a.tarif)} / ${a.satuan}</p></div>
                    <input type="date" id="bk-tgl" value="${todayISO()}" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                    <input type="number" id="bk-dur" min="1" value="1" placeholder="Durasi" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs">
                </div>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Batal</button>
                <button onclick="saveBooking('${a.id}')" class="px-5 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold">Kirim Booking</button>
            `);
        }

        function saveBooking(id) {
            const w = getActiveWarga();
            const a = state.asetList.find(x => x.id === id);
            const durasi = Math.max(1, parseInt(document.getElementById('bk-dur').value) || 1);
            state.bookingList.unshift({
                id: 'SW-' + String(Date.now()).slice(-4), wargaId: w.id, namaWarga: w.nama, dusun: w.dusun,
                namaAset: a.nama, tanggalPakai: document.getElementById('bk-tgl').value,
                durasi, total: a.tarif * durasi, status: 'Menunggu'
            });
            syncCloudKey('bookingList');
            closeModal(); renderApp();
            showToast(`Booking ${a.nama} terkirim ke Admin Desa!`, 'success');
        }

        function renderTransparansi(el) {
            const t = calcTransparansi();
            const maxVal = Math.max(1, ...Object.values(t.perUnit));
            el.innerHTML = `
                <div class="space-y-5">
                    <div class="bg-gradient-to-r from-slate-900 to-emerald-900 text-white rounded-3xl p-6 shadow-lg">
                        <span class="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] font-bold uppercase">Transparansi Live</span>
                        <h2 class="text-xl font-extrabold mt-2">Laporan Keuangan BUMDes Desa Gelanggang</h2>
                        <p class="text-xs text-slate-300 mt-1">Dihitung otomatis secara langsung dari Buku Kas Pengurus BUMDes.</p>
                    </div>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <div class="bg-white p-4 rounded-2xl border"><p class="text-[11px] text-slate-500">Saldo Kas</p><p class="text-lg font-extrabold mt-1">${formatRp(t.saldoKas)}</p></div>
                        <div class="bg-white p-4 rounded-2xl border"><p class="text-[11px] text-slate-500">Pendapatan</p><p class="text-lg font-extrabold text-emerald-600 mt-1">${formatRp(t.pendUsaha)}</p></div>
                        <div class="bg-white p-4 rounded-2xl border"><p class="text-[11px] text-slate-500">Pengeluaran</p><p class="text-lg font-extrabold text-rose-600 mt-1">${formatRp(t.beban)}</p></div>
                        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200"><p class="text-[11px] text-emerald-700 font-semibold">Estimasi PADes (30%)</p><p class="text-lg font-extrabold text-emerald-700 mt-1">${formatRp(t.pades)}</p></div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3.5">
                        <h3 class="font-bold text-sm">Pendapatan per Unit Usaha</h3>
                        ${Object.entries(t.perUnit).map(([k, v]) => `
                            <div>
                                <div class="flex justify-between text-xs font-bold mb-1"><span>${k}</span><span class="text-emerald-600">${formatRp(v)}</span></div>
                                <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-emerald-500 rounded-full" style="width:${Math.round((v/maxVal)*100)}%"></div></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAspirasi(el, warga) {
            const myAsp = state.aspirasiList.filter(a => a.wargaId === warga.id);
            el.innerHTML = `
                <div class="grid md:grid-cols-12 gap-5">
                    <div class="md:col-span-5 bg-white rounded-2xl border p-5 shadow-sm h-fit space-y-3">
                        <h2 class="text-lg font-extrabold">Aspirasi & Pengaduan</h2>
                        <select id="asp-kat" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs"><option value="Usulan Unit Usaha">Usulan Unit Usaha</option><option value="Pelayanan">Saran Pelayanan</option><option value="Pengaduan">Pengaduan Kendala</option></select>
                        <textarea id="asp-msg" rows="4" placeholder="Tulis pesan Anda..." class="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs"></textarea>
                        <button onclick="sendAspirasi()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow">Kirim ke Pengurus Desa</button>
                    </div>
                    <div class="md:col-span-7 space-y-3">
                        <h3 class="font-bold text-sm">Riwayat Aspirasi Anda</h3>
                        ${myAsp.map(a => `
                            <div class="bg-white rounded-2xl border p-4 shadow-sm space-y-2 text-xs">
                                <div class="flex justify-between"><span class="font-bold text-slate-500">${a.kategori} • ${a.tanggal}</span><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${a.status==='Ditanggapi'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${a.status}</span></div>
                                <p>${a.pesan}</p>
                                ${a.tanggapan ? `<div class="p-3 rounded-xl bg-emerald-50 text-emerald-900"><strong>Balasan Pengurus:</strong> ${a.tanggapan}</div>` : '<p class="text-[11px] text-slate-400 italic">Menunggu tanggapan pengurus...</p>'}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function sendAspirasi() {
            const w = getActiveWarga();
            const msg = document.getElementById('asp-msg').value.trim();
            if (!msg) { showToast('Tulis pesan terlebih dahulu!', 'warning'); return; }
            state.aspirasiList.unshift({
                id: 'ASP-' + String(Date.now()).slice(-4), tanggal: todayISO(),
                wargaId: w.id, namaWarga: w.nama,
                kategori: document.getElementById('asp-kat').value,
                pesan: msg, status: 'Baru', tanggapan: ''
            });
            syncCloudKey('aspirasiList');
            renderApp();
            showToast('Aspirasi terkirim ke Admin Desa!', 'success');
        }

        window.onload = function () {
            initWargaSelector();
            updateCartBadge();
            renderApp();
            initCloudSync();
        };
    </script>
</body>
</html>
