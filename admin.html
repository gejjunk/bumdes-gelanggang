        // =========================================================================
        // 2. MESIN SINKRONISASI CLOUD (SUPABASE POSTGRESQL + REALTIME)
        // =========================================================================
        const CLOUD_KEYS = ['pins', 'wargaList', 'produkList', 'pesananList', 'pinjamanList', 'asetList', 'bookingList', 'transaksiKas', 'aspirasiList', 'kontakDarurat'];

        async function initCloudSync() {
            const configured = SUPABASE_URL && !SUPABASE_URL.includes('GANTI_DENGAN_') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('GANTI_DENGAN_');
            if (!configured || typeof window.supabase === 'undefined') {
                setCloudStatusUI(false);
                return;
            }
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                const { data, error } = await supabaseClient.from('bumdes_store').select('key, value');
                if (error) {
                    console.error('Supabase fetch error:', error);
                    setCloudStatusUI(false);
                    showToast('Koneksi Supabase gagal. Cek URL, Key, atau tabel bumdes_store.', 'error');
                    return;
                }

                isCloudConnected = true;
                setCloudStatusUI(true);

                if (!data || data.length === 0) {
                    const rows = CLOUD_KEYS.map(k => ({ key: k, value: state[k] }));
                    await supabaseClient.from('bumdes_store').upsert(rows, { onConflict: 'key' });
                } else {
                    data.forEach(row => {
                        if (row.key === 'pins' && row.value) {
                            state.pins = { ...state.pins, ...row.value };
                        } else if (CLOUD_KEYS.includes(row.key) && row.value !== null && row.value !== undefined) {
                            state[row.key] = row.value;
                        }
                    });
                    if (state.auth) renderApp();
                }

                supabaseClient
                    .channel('bumdes-admin-realtime')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'bumdes_store' }, (payload) => {
                        if (payload.new && CLOUD_KEYS.includes(payload.new.key)) {
                            if (payload.new.key === 'pins') {
                                state.pins = { ...state.pins, ...payload.new.value };
                            } else {
                                state[payload.new.key] = payload.new.value;
                            }
                            if (state.auth) renderApp();
                        }
                    })
                    .subscribe();

            } catch (e) {
                console.error(e);
                setCloudStatusUI(false);
            }
        }

                    console.error('Gagal sync ke Supabase:', error);
                    showToast('Gagal menyimpan ke Supabase!', 'error');
                }
            }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold fade-in ${colors[type] || colors.info}`;
            toast.textContent = msg;

            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

            document.getElementById('modal-title').textContent = title;

            document.getElementById('modal-footer').innerHTML = footer || `<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Tutup</button>`;
            document.getElementById('modal-backdrop').classList.remove('hidden');

        function loginAdmin() {
            const role = document.getElementById('admin-role-select').value;
            const pin = document.getElementById('admin-pin-input').value.trim();
            if (pin === (state.pins[role] || '1234')) {
                state.auth = true;
                state.role = role;
                document.getElementById('admin-pin-input').value = '';
                document.getElementById('sidebar-role').textContent = role;
                document.getElementById('mobile-role').textContent = role;
                showToast(`Selamat datang, ${role}!`, 'success');
                renderApp();

                showToast(`PIN untuk ${role} salah!`, 'error');

        }

        function logoutAdmin() { state.auth = false; showToast('Panel Admin dikunci', 'info'); renderApp(); }

        function openChangePinModal() {
            const isDir = state.role === 'Direktur BUMDes';
            const roles = Object.keys(state.pins);
            openModal('Ganti PIN Keamanan', `
                <div class="space-y-3">
                    <div>

            `);

        function saveNewPin() {
            const r = document.getElementById('pin-role').value;
            const oldP = document.getElementById('pin-old').value.trim();
            const newP = document.getElementById('pin-new').value.trim();
            const cfmP = document.getElementById('pin-cfm').value.trim();
            if (oldP !== state.pins[r]) { showToast('PIN lama salah!', 'error'); return; }
            if (!/^\d{4}$/.test(newP)) { showToast('PIN baru harus 4 angka!', 'warning'); return; }

            state.pins[r] = newP;
            syncCloudKey('pins');
            closeModal();
            showToast(`PIN ${r} berhasil diubah & tersimpan!`, 'success');
        }

        function toggleSidebar() {
            const sb = document.getElementById('admin-sidebar');
            sb.classList.toggle('hidden'); sb.classList.toggle('fixed'); sb.classList.toggle('inset-y-0'); sb.classList.toggle('left-0');
        }

        function setTab(t) {
            state.tab = t;
            if (window.innerWidth < 1024) document.getElementById('admin-sidebar').classList.add('hidden');
            renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function calcFinance() {
            let masuk = 0, keluar = 0, pendUsaha = 0, beban = 0;
            state.transaksiKas.forEach(t => {
                if (t.jenis === 'Masuk') { masuk += t.nominal; if (t.unit !== 'Modal Desa') pendUsaha += t.nominal; }
                else { keluar += t.nominal; beban += t.nominal; }
            });
            const saldo = masuk - keluar, laba = Math.max(0, pendUsaha - beban);
            const piutang = state.pinjamanList.filter(p => p.status === 'Aktif').reduce((s, p) => s + (p.totalTagihan - p.terbayar), 0);
            return { saldo, pendUsaha, beban, laba, piutang, pades: Math.round(laba * 0.30), modal: Math.round(laba * 0.40), pengurus: Math.round(laba * 0.20), sosial: Math.round(laba * 0.10) };
        }

        function updateBadges() {
            const setB = (id, n) => { const e = document.getElementById(id); if (!e) return; e.textContent = n; e.classList.toggle('hidden', n === 0); };
            setB('badge-pinjaman', state.pinjamanList.filter(p => p.status === 'Menunggu').length);
            setB('badge-pesanan', state.pesananList.filter(o => o.status === 'Menunggu').length);
            setB('badge-sewa', state.bookingList.filter(b => b.status === 'Menunggu').length);
            setB('badge-aspirasi', state.aspirasiList.filter(a => a.status === 'Baru').length);
        }

        function renderApp() {

            updateBadges();
            document.querySelectorAll('.atab-btn').forEach(btn => {

            document.getElementById('mobile-title').textContent = titles[state.tab];

            const el = document.getElementById('admin-content');

            else if (state.tab === 'toko') renderToko(el);
            else if (state.tab === 'sewa') renderSewa(el);
            else if (state.tab === 'warga') renderWarga(el);
            else if (state.tab === 'darurat') renderDarurat(el);
        }

                        <div class="bg-white p-4 rounded-2xl border shadow-sm"><p class="text-xs text-slate-500">Pendapatan Usaha</p><p class="text-xl font-extrabold text-emerald-600 mt-1">${formatRp(f.pendUsaha)}</p></div>

                        <div class="bg-white p-4 rounded-2xl border ${pending>0?'border-rose-300 bg-rose-50/40':''} shadow-sm"><p class="text-xs text-slate-500">Perlu Verifikasi</p><p class="text-xl font-extrabold text-rose-600 mt-1">${pending} Antrean</p></div>

            state.transaksiKas.unshift({ id: 'KAS-' + String(Date.now()).slice(-4), tanggal: todayISO(), jenis: document.getElementById('k-jenis').value, unit: document.getElementById('k-unit').value, nominal: nom, keterangan: ket });

            closeModal(); renderApp(); showToast('Transaksi dicatat & tersinkronisasi!', 'success');

            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));

        function approveLoan(id) {
            const l = state.pinjamanList.find(x => x.id === id);
            l.status = 'Aktif';
            state.transaksiKas.unshift({ id: 'KAS-' + String(Date.now()).slice(-4), tanggal: todayISO(), jenis: 'Keluar', unit: 'Simpan Pinjam', nominal: l.nominal, keterangan: `Pencairan ${l.id} (${l.namaWarga})` });
            syncCloudKey('pinjamanList'); syncCloudKey('transaksiKas');
            renderApp(); showToast('Pinjaman dicairkan & dicatat di Kas!', 'success');
        }

        function payLoan(id) {
            const l = state.pinjamanList.find(x => x.id === id);
            l.sudahBayarBulan++; l.terbayar += l.angsuranPerBulan;
            if (l.sudahBayarBulan >= l.tenor) { l.status = 'Lunas'; l.terbayar = l.totalTagihan; }
            state.transaksiKas.unshift({ id: 'KAS-' + String(Date.now()).slice(-4), tanggal: todayISO(), jenis: 'Masuk', unit: 'Simpan Pinjam', nominal: l.angsuranPerBulan, keterangan: `Angsuran ke-${l.sudahBayarBulan} ${l.id} (${l.namaWarga})` });

                            ${state.posCart.length===0?'<p class="text-xs text-slate-400 text-center py-6">Pilih produk di kiri.</p>':`
                                ${state.posCart.map((i,idx)=>`<div class="flex justify-between text-xs py-1.5 border-b"><span>${i.nama} x${i.qty}</span><button onclick="state.posCart.splice(${idx},1);renderApp()" class="text-rose-500"><i class="fa-solid fa-trash"></i></button></div>`).join('')}
                                <div class="flex justify-between font-extrabold text-base my-3"><span>Total</span><span class="text-emerald-600">${formatRp(tot)}</span></div>
                                <button onclick="payPos()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">Bayar & Masuk Kas</button>
                            `}
                        </div>
                    </div>
                `;
            } else {
                b.innerHTML = `
                    <div class="bg-white rounded-2xl border p-4 overflow-x-auto">
                        <div class="flex justify-between items-center mb-3"><h3 class="font-bold text-sm">Stok Kios BUMDes</h3><button onclick="openAddProdModal()" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">+ Tambah Produk</button></div>
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50 text-slate-500 uppercase text-[10px]"><tr><th class="p-2.5">Produk</th><th class="p-2.5">Harga</th><th class="p-2.5">Stok</th><th class="p-2.5 text-right">Aksi</th></tr></thead>
                            <tbody class="divide-y">${state.produkList.map(p=>`<tr><td class="p-2.5 font-bold">${p.nama}</td><td class="p-2.5">${formatRp(p.harga)}</td><td class="p-2.5 font-bold">${p.stok} ${p.satuan}</td><td class="p-2.5 text-right"><button onclick="pRestock('${p.id}')" class="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-bold">+10</button></td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                `;
            }
        }

        function doneOrder(id) {
            const o = state.pesananList.find(x => x.id === id);
            o.status = 'Selesai';
            o.items.forEach(i => { const p = state.produkList.find(x => x.id === i.id); if (p) p.stok = Math.max(0, p.stok - i.qty); });
            state.transaksiKas.unshift({ id: 'KAS-' + String(Date.now()).slice(-4), tanggal: todayISO(), jenis: 'Masuk', unit: 'Toko UMKM', nominal: o.total, keterangan: `Pesanan ${o.id} (${o.namaWarga})` });
            syncCloudKey('pesananList'); syncCloudKey('produkList'); syncCloudKey('transaksiKas');
            renderApp(); showToast('Pesanan selesai & masuk Kas!', 'success');
        }
        function addPos(id) { const p = state.produkList.find(x => x.id === id); if (!p || p.stok <= 0) return; const e = state.posCart.find(i => i.id === id); e ? e.qty++ : state.posCart.push({ id: p.id, nama: p.nama, harga: p.harga, qty: 1 }); renderApp(); }
        function payPos() {
            const tot = state.posCart.reduce((s, i) => s + (i.harga * i.qty), 0);
            state.posCart.forEach(i => { const p = state.produkList.find(x => x.id === i.id); if (p) p.stok = Math.max(0, p.stok - i.qty); });
            state.transaksiKas.unshift({ id: 'KAS-' + String(Date.now()).slice(-4), tanggal: todayISO(), jenis: 'Masuk', unit: 'Toko UMKM', nominal: tot, keterangan: `Penjualan Kasir POS (${state.posCart.length} item)` });
            state.posCart = [];
            syncCloudKey('produkList'); syncCloudKey('transaksiKas');
            renderApp(); showToast('Transaksi POS berhasil!', 'success');
        }
        function pRestock(id) { const p = state.produkList.find(x => x.id === id); p.stok += 10; syncCloudKey('produkList'); renderApp(); showToast(`Stok ${p.nama} +10`, 'success'); }
        function openAddProdModal() {
            openModal('Tambah Produk Toko', `
                <div class="space-y-3">
                    <input id="np-n" placeholder="Nama Produk" class="w-full rounded-xl border px-3 py-2 text-xs">
                    <select id="np-k" class="w-full rounded-xl border px-3 py-2 text-xs"><option value="Sembako">Sembako</option><option value="Pertanian">Pertanian</option><option value="UMKM Lokal">UMKM Lokal</option></select>
                    <div class="grid grid-cols-2 gap-2"><input type="number" id="np-h" placeholder="Harga (Rp)" class="rounded-xl border px-3 py-2 text-xs"><input type="number" id="np-s" placeholder="Stok" class="rounded-xl border px-3 py-2 text-xs"></div>
                </div>
            `, `<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Batal</button><button onclick="saveNewProd()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Simpan</button>`);
        }
        function saveNewProd() {
            const nama = document.getElementById('np-n').value.trim(), harga = parseInt(document.getElementById('np-h').value);
            if (!nama || !harga) return;
            state.produkList.push({ id: 'P' + String(Date.now()).slice(-4), nama, kategori: document.getElementById('np-k').value, harga, stok: parseInt(document.getElementById('np-s').value) || 10, satuan: 'Pcs', icon: 'fa-box-open', color: 'emerald' });
            syncCloudKey('produkList'); closeModal(); renderApp(); showToast('Produk baru ditambahkan!', 'success');
        }

        function renderSewa(el) {
            el.innerHTML = `
                <div class="space-y-5">
                    <div class="flex flex-wrap justify-between items-center gap-3">
                        <h1 class="text-xl font-extrabold">Kelola Aset & Sewa Desa</h1>
                        <button onclick="openAddAsetModal()" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold shadow"><i class="fa-solid fa-plus mr-1"></i> Tambah Aset Desa</button>
                    </div>
                    <div class="grid sm:grid-cols-2 gap-3">
                        ${state.asetList.map(a => `
                            <div class="bg-white rounded-2xl border p-4 flex flex-col justify-between gap-3">
                                <div class="flex justify-between items-start gap-2">
                                    <div class="flex gap-3"><div class="w-10 h-10 rounded-xl bg-sky-100 text-sky-600 flex items-center justify-center shrink-0"><i class="fa-solid ${a.icon}"></i></div>
                                    <div><p class="font-bold text-xs">${a.nama}</p><p class="text-xs font-extrabold text-emerald-600">${formatRp(a.tarif)} / ${a.satuan}</p><p class="text-[11px] text-slate-500 mt-0.5">${a.deskripsi}</p></div></div>
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${a.status==='Tersedia'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}">${a.status}</span>
                                </div>
                                <div class="flex justify-end gap-2 pt-2 border-t">
                                    <button onclick="toggleAset('${a.id}')" class="px-2.5 py-1 rounded-lg bg-slate-100 text-[11px] font-bold">${a.status==='Tersedia'?'Set Perawatan':'Set Tersedia'}</button>
                                    <button onclick="delAset('${a.id}')" class="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-600 text-[11px] font-bold">Hapus</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="bg-white rounded-2xl border p-4">
                        <h3 class="font-bold text-sm mb-3">Antrean Booking Warga</h3>
                        ${state.bookingList.map(b => `
                            <div class="p-3 rounded-xl bg-slate-50 border flex flex-wrap justify-between items-center gap-2 text-xs mb-2">
                                <div><p class="font-bold">${b.namaAset} — ${b.namaWarga}</p><p class="text-slate-500">Tgl Pakai: ${b.tanggalPakai} (${b.durasi} hari)</p></div>
                                <div class="flex items-center gap-2"><span class="font-extrabold text-emerald-700">${formatRp(b.total)}</span>
                                ${b.status==='Menunggu'?`<button onclick="approveBook('${b.id}')" class="px-3 py-1.5 rounded-xl bg-sky-600 text-white font-bold">Setujui & Kas</button>`:`<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold">${b.status}</span>`}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openAddAsetModal() {
            openModal('Tambah Aset Desa Baru', `
                <div class="space-y-3">
                    <input id="na-nama" placeholder="Nama Aset (mis: Aula Balai Desa)" class="w-full rounded-xl border px-3 py-2 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="na-tarif" placeholder="Tarif (Rp)" class="rounded-xl border px-3 py-2 text-xs">
                        <select id="na-sat" class="rounded-xl border px-3 py-2 text-xs"><option value="Hari">Hari</option><option value="Paket">Paket</option><option value="Rit / Hari">Rit / Hari</option><option value="Bulan">Bulan</option></select>
                    </div>
                    <select id="na-ico" class="w-full rounded-xl border px-3 py-2 text-xs"><option value="fa-building">Gedung / Aula / Kios</option><option value="fa-tent">Tenda / Kursi</option><option value="fa-tractor">Alat Pertanian</option><option value="fa-truck-pickup">Kendaraan</option><option value="fa-gears">Peralatan Lainnya</option></select>
                    <textarea id="na-desk" rows="2" placeholder="Deskripsi singkat..." class="w-full rounded-xl border px-3 py-2 text-xs"></textarea>
                </div>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Batal</button>
                <button onclick="saveAset()" class="px-5 py-2 rounded-xl bg-sky-600 text-white text-xs font-bold">Simpan Aset</button>
            `);
        }

        function saveAset() {
            const nama = document.getElementById('na-nama').value.trim(), tarif = parseInt(document.getElementById('na-tarif').value);
            if (!nama || !tarif) { showToast('Isi nama aset & tarif!', 'warning'); return; }
            state.asetList.unshift({ id: 'A' + Date.now(), nama, tarif, satuan: document.getElementById('na-sat').value, icon: document.getElementById('na-ico').value, deskripsi: document.getElementById('na-desk').value.trim() || 'Aset resmi Desa Gelanggang.', status: 'Tersedia' });
            syncCloudKey('asetList'); closeModal(); renderApp(); showToast('Aset desa berhasil ditambahkan!', 'success');
        }
        function toggleAset(id) { const a = state.asetList.find(x => x.id === id); a.status = a.status === 'Tersedia' ? 'Perawatan' : 'Tersedia'; syncCloudKey('asetList'); renderApp(); }
        function delAset(id) { state.asetList = state.asetList.filter(x => x.id !== id); syncCloudKey('asetList'); renderApp(); showToast('Aset dihapus', 'info'); }
        function approveBook(id) {
            const b = state.bookingList.find(x => x.id === id); b.status = 'Disetujui & Lunas';
            state.transaksiKas.unshift({ id: 'KAS-' + String(Date.now()).slice(-4), tanggal: todayISO(), jenis: 'Masuk', unit: 'Sewa Aset', nominal: b.total, keterangan: `Sewa ${b.namaAset} (${b.namaWarga})` });
            syncCloudKey('bookingList'); syncCloudKey('transaksiKas');
            renderApp(); showToast('Booking disetujui & masuk Kas!', 'success');
        }

        function renderWarga(el) {
            el.innerHTML = `
                <div class="space-y-5">
                    <h1 class="text-xl font-extrabold">Direktori Warga & Aspirasi</h1>
                    <div class="bg-white rounded-2xl border p-5 shadow-sm space-y-3">
                        <h3 class="font-bold text-sm">Aspirasi Masuk</h3>
                        ${state.aspirasiList.map(a => `
                            <div class="p-3.5 rounded-xl bg-slate-50 border text-xs">
                                <p class="font-bold">${a.namaWarga} • <span class="text-purple-600">${a.kategori}</span></p>
                                <p class="my-1.5">"${a.pesan}"</p>
                                ${a.tanggapan ? `<p class="text-emerald-700 bg-white p-2 rounded-lg border"><strong>Balasan:</strong> ${a.tanggapan}</p>` : `
                                    <div class="flex gap-2 mt-2"><input id="rep-${a.id}" placeholder="Ketik balasan..." class="flex-1 rounded-xl border px-3 py-1.5 text-xs"><button onclick="replyAsp('${a.id}')" class="px-3 py-1.5 rounded-xl bg-purple-600 text-white font-bold">Balas</button></div>
                                `}
                            </div>
                        `).join('')}
                    </div>
                    <div class="bg-white rounded-2xl border p-5 shadow-sm overflow-x-auto">
                        <h3 class="font-bold text-sm mb-3">Warga Terdaftar (${state.wargaList.length})</h3>
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50 text-slate-500 uppercase text-[10px]"><tr><th class="p-2.5">Nama</th><th class="p-2.5">Dusun</th><th class="p-2.5">Status</th></tr></thead>
                            <tbody class="divide-y">${state.wargaList.map(w=>`<tr><td class="p-2.5 font-bold">${w.nama}</td><td class="p-2.5">${w.dusun}</td><td class="p-2.5"><span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-bold text-[10px]">${w.status}</span></td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function replyAsp(id) {
            const a = state.aspirasiList.find(x => x.id === id);
            const txt = document.getElementById('rep-' + id).value.trim();
            if (!txt) return;
            a.tanggapan = txt; a.status = 'Ditanggapi';
            syncCloudKey('aspirasiList'); renderApp(); showToast('Tanggapan terkirim ke Warga!', 'success');
        }

        function renderDarurat(el) {
            const isDirektur = state.role === 'Direktur BUMDes';
            el.innerHTML = `
                <div class="space-y-5">
                    <div class="flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <h1 class="text-xl font-extrabold text-slate-900">Kontak Darurat 24 Jam Desa</h1>
                            <p class="text-xs text-slate-500">Nomor Ambulans, Damkar, dan Bidan Desa yang tampil di Aplikasi Warga.</p>
                        </div>
                        ${isDirektur ? `<button onclick="openAddDaruratModal()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold shadow"><i class="fa-solid fa-plus mr-1"></i> Tambah Kontak</button>`
                                     : `<span class="px-3 py-1.5 rounded-xl bg-amber-100 text-amber-800 text-xs font-bold"><i class="fa-solid fa-lock mr-1"></i> Khusus Direktur BUMDes</span>`}
                    </div>
                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${state.kontakDarurat.map(k => `
                            <div class="bg-white rounded-2xl border p-4 shadow-sm flex flex-col justify-between gap-3">
                                <div class="flex items-start gap-3">
                                    <div class="w-11 h-11 rounded-xl bg-${k.color || 'rose'}-100 text-${k.color || 'rose'}-600 flex items-center justify-center text-lg shrink-0"><i class="fa-solid ${k.icon}"></i></div>
                                    <div class="min-w-0">
                                        <p class="font-extrabold text-sm">${k.nama}</p>
                                        <p class="text-[11px] text-slate-500">${k.petugas}</p>
                                        <p class="text-xs font-semibold mt-2"><i class="fa-solid fa-phone text-rose-500 w-4"></i> ${k.telp}</p>
                                        <p class="text-xs font-semibold"><i class="fa-brands fa-whatsapp text-emerald-600 w-4"></i> +${k.wa}</p>
                                    </div>
                                </div>
                                ${isDirektur ? `
                                    <div class="flex justify-end gap-2 pt-2.5 border-t">
                                        <button onclick="openEditDaruratModal('${k.id}')" class="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-800 text-[11px] font-bold"><i class="fa-solid fa-pen mr-1"></i> Ubah Nomor</button>
                                        <button onclick="deleteDarurat('${k.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-50 text-rose-600 text-[11px] font-bold"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openEditDaruratModal(id) {
            if (state.role !== 'Direktur BUMDes') return;
            const k = state.kontakDarurat.find(x => x.id === id);
            openModal('Ubah Nomor Darurat', `
                <div class="space-y-3">
                    <input id="ed-nama" value="${k.nama}" class="w-full rounded-xl border px-3 py-2 text-xs">
                    <input id="ed-petugas" value="${k.petugas}" class="w-full rounded-xl border px-3 py-2 text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="ed-telp" value="${k.telp}" placeholder="No. Telepon" class="rounded-xl border px-3 py-2 text-xs">
                        <input id="ed-wa" value="${k.wa}" placeholder="No. WA (62...)" class="rounded-xl border px-3 py-2 text-xs">
                    </div>
                </div>
            `, `<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Batal</button><button onclick="saveEditDarurat('${k.id}')" class="px-5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Simpan</button>`);
        }

        function saveEditDarurat(id) {
            if (state.role !== 'Direktur BUMDes') return;
            const k = state.kontakDarurat.find(x => x.id === id);
            const nama = document.getElementById('ed-nama').value.trim(), telp = document.getElementById('ed-telp').value.trim();
            if (!nama || !telp) return;
            k.nama = nama; k.petugas = document.getElementById('ed-petugas').value.trim() || 'Unit Siaga Desa';
            k.telp = telp; k.wa = document.getElementById('ed-wa').value.replace(/[^0-9]/g, '') || telp.replace(/^0/, '62');
            syncCloudKey('kontakDarurat'); closeModal(); renderApp();
            showToast(`Nomor ${k.nama} diperbarui & langsung berubah di HP Warga!`, 'success');
        }

        function openAddDaruratModal() {
            if (state.role !== 'Direktur BUMDes') return;
            openModal('Tambah Kontak Darurat', `
                <div class="space-y-3">
                    <input id="nd-nama" placeholder="Nama Layanan (mis: Babinsa / Polisi)" class="w-full rounded-xl border px-3 py-2 text-xs">
                    <input id="nd-petugas" placeholder="Keterangan Petugas" class="w-full rounded-xl border px-3 py-2 text-xs">
                    <div class="grid grid-cols-2 gap-2"><input id="nd-telp" placeholder="No. Telepon" class="rounded-xl border px-3 py-2 text-xs"><input id="nd-wa" placeholder="No. WA (62...)" class="rounded-xl border px-3 py-2 text-xs"></div>
                    <select id="nd-ico" class="w-full rounded-xl border px-3 py-2 text-xs"><option value="fa-truck-medical">Ambulans</option><option value="fa-fire-extinguisher">Damkar</option><option value="fa-user-nurse">Bidan / Medis</option><option value="fa-shield-halved">Keamanan</option></select>
                </div>
            `, `<button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-xs font-bold">Batal</button><button onclick="saveNewDarurat()" class="px-5 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">Simpan</button>`);
        }

        function saveNewDarurat() {
            if (state.role !== 'Direktur BUMDes') return;
            const nama = document.getElementById('nd-nama').value.trim(), telp = document.getElementById('nd-telp').value.trim();
            if (!nama || !telp) return;
            const wa = document.getElementById('nd-wa').value.replace(/[^0-9]/g, '') || telp.replace(/^0/, '62');
            state.kontakDarurat.push({ id: 'DR-' + Date.now(), nama, petugas: document.getElementById('nd-petugas').value.trim() || 'Unit Siaga Desa', telp, wa, icon: document.getElementById('nd-ico').value, color: 'rose' });
            syncCloudKey('kontakDarurat'); closeModal(); renderApp(); showToast('Kontak darurat ditambahkan!', 'success');
        }

        function deleteDarurat(id) {
            if (state.role !== 'Direktur BUMDes') return;
            state.kontakDarurat = state.kontakDarurat.filter(x => x.id !== id);
            syncCloudKey('kontakDarurat'); renderApp(); showToast('Kontak darurat dihapus', 'info');
        }

        window.onload = function () { renderApp(); initCloudSync(); };
    </script>
</body>
</html>
